
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FabaFilms Rewarded Ad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="https://cdn.applixir.com/applixir.app.v5.0.1.js"></script>
</head>
<body>
  <div id="some-id"></div>
  <button id="start">Watch Ad</button>

  <script type="text/javascript">
    const options = {
      accountId: 8808,
      siteId: 9357,
      zoneId: 2050,
      injectionElementId: "some-id",
      adStatusCallbackFn: (status) => {
        console.log("Ad status:", status);
      },
      adErrorCallbackFn: (error) => {
        console.log("Ad error:", error.getError().toString());
      },
    };

    var application = new Application(options);
    window.onload = () => {
      application.initialize();
      document.getElementById("start").addEventListener("click", () => {
        application.openPlayer();
      });
    };
  </script>
</body>
</html>
